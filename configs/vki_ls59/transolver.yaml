# Transolver++ on VKI-LS59 (target_channel 0: Mach, 1: nu_t) (one network per variable, one mesh per step); coordinate_type ori or tbal.
system: {num_epochs: 400, macro_batch_size: 1, learning_rate: 0.001, weight_decay: 1e-4, optimizer: adamw,
  lr_scheduler: one_cycle, grad_clip: 1.0, grad_accum_steps: 1, seed: 0, num_plot_samples: 10}
model: {architecture: transolver, out_dim: 1, n_layers_transolver: 5, n_hidden_transolver: 256, n_head_transolver: 8,
  slice_num_transolver: 32}
data: {dataset_name: vki_ls59, base_folder: data/vki_ls59/, dataset_version: full, target_channel: 0,
  coordinate_type: ori, shuffle: true}
